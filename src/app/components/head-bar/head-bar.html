<header class="header">
  <div class="header-content">
    <h1 class="shop-name">{{ shopName }}</h1>
    <div class="buttons">
      <button class="favorites-button" [class.active]="showingFavorites" (click)="onFavoritesClick()">
        <fa-icon [icon]="faHeart"></fa-icon> Favoris ({{ favoritesCount }})
      </button>
      <button class="contact-button" (click)="onContactClick()">Contact</button>
    </div>
  </div>
</header>
